<!doctype html><meta charset="utf-8"><title>Hypermaker</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#17181b;color:#eee;font:13px system-ui}header{height:48px;padding:8px 12px;display:flex;gap:8px;align-items:center;background:#24262b;border-bottom:1px solid #3a3d44}header b{font-size:16px;margin-right:12px}input,select,textarea,button{background:#17191d;border:1px solid #4b505a;border-radius:4px;color:#eee;padding:6px}button{cursor:pointer}.settings{margin-left:auto;display:flex;gap:8px;align-items:center}.viewport{height:calc(100% - 48px);overflow:hidden;position:relative;background-image:radial-gradient(#34373d 1px,transparent 1px);background-size:24px 24px}.world{position:absolute;inset:0;transform-origin:0 0}.edges{position:absolute;inset:0;width:100%;height:100%;z-index:20;overflow:visible;pointer-events:none}.edge{fill:none;stroke:#8bd5ff;stroke-width:2.5;marker-end:url(#arrow)}.edge-hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke}.cards{position:absolute;inset:0}.card{position:absolute;width:250px;background:#272a30;border:1px solid #555b66;border-radius:6px;box-shadow:0 8px 18px #0008;overflow:hidden}.card header{height:30px;padding:6px 8px;background:#30343b;border:0;cursor:grab;font-weight:600}.card main{padding:7px}.preview{height:110px;background:#111317;border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:6px}.preview img,.preview video{max-width:100%;max-height:100%;cursor:zoom-in}.preview audio{width:95%}.preview pre{white-space:pre-wrap;overflow-wrap:anywhere;width:100%;height:100%;overflow:auto;margin:0;padding:7px}.selectors{display:flex;gap:4px}.selectors select{min-width:0;flex:1;font-size:11px}.prompt{display:block;width:100%;height:58px;resize:vertical;margin:6px 0;overflow-x:hidden;overflow-wrap:anywhere;white-space:pre-wrap}.actions{display:flex;gap:5px}.meta{color:#aab2bf;font-size:11px}.error{color:#ff8f8f;white-space:pre-wrap;overflow-wrap:anywhere}</style>
<header><b>◆ Hypermaker</b><button id="reset">Reset layout</button><label>model <select id="model"><option>gpt-5.6-luna</option><option>gpt-5.6-terra</option><option>gpt-5.6-sol</option></select></label><label>effort <select id="effort"><option>none</option><option>low</option><option selected>medium</option><option>high</option><option>xhigh</option><option>max</option><option>ultra</option></select></label><label><input id="gh" type="checkbox"> gh/</label></header>
<div class="viewport" id="viewport"><div class="world" id="world"><svg class="edges"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#8bd5ff"/></marker></defs></svg><div class="cards" id="cards"></div></div></div>
<script>
const $=s=>document.querySelector(s),state={nodes:{}},nodes=new Map(),scale=1,registry=fetch('/api/registry').then(r=>r.json());
async function load(){Object.assign(state,await (await fetch('/api/workspace')).json());nodes.clear();Object.entries(state.nodes).forEach(([id,n])=>nodes.set(+id,n));render()}async function api(path,data){const method=path==='/api/node'?(data.id==null?'POST':'PATCH'):'POST';const r=await fetch(path,{method,headers:{'content-type':'application/json'},body:JSON.stringify(data)}),x=await r.json();if(x.error)throw Error(x.error);Object.assign(state,x);nodes.clear();Object.entries(state.nodes).forEach(([id,n])=>nodes.set(+id,n));render();return x}function esc(x){return String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function methods(t){return registry.then(r=>r.methods[t]||[])}function url(n){return n.artifact&&n.workdir?'/api/file?path='+encodeURIComponent(n.workdir+'/'+n.artifact):''}function types(){return['text','image','audio','video'].map(x=>`<option>${x}</option>`).join('')}
function preview(n){if(!n.artifact)return'no artifact';const u=url(n);return n.type==='text'?'<pre>loading...</pre>':n.type==='image'?`<img data-preview-image src="${u}">`:n.type==='audio'?`<audio controls src="${u}"></audio>`:`<video controls src="${u}"></video>`}async function loadText(el,n){if(n.type==='text'&&n.artifact)el.innerHTML=`<pre>${esc(await(await fetch(url(n))).text())}</pre>`}
function render(){const root=$('#cards');root.innerHTML='';Object.values(state.nodes).forEach(n=>{const e=document.createElement('article');e.className='card';e.dataset.id=n.id;e.style.left=(n.x||0)+'px';e.style.top=(n.y||0)+'px';e.innerHTML=`<header>${n.artifact||'New node'} <span class="meta">#${n.id} ${n.status}</span></header><main><div class="preview">${preview(n)}</div><div class="selectors"><select data-field="type">${types()}</select><select data-field="method"></select><select data-field="quality">${['sketch','demo','standard','artistic','realistic'].map(x=>`<option>${x}</option>`).join('')}</select></div><textarea class="prompt" placeholder="Describe artifact">${esc(n.prompt||'')}</textarea><div class="actions"><button data-action="generate" ${n.status==='running'||!n.method?'disabled':''}>Generate</button><button data-action="download" ${n.artifact?'':'disabled'}>Download</button></div>${n.error?`<div class="error">${esc(n.error)}</div>`:''}</main>`;root.append(e);const type=e.querySelector('[data-field=type]');type.value=n.type;e.querySelector('[data-field=quality]').value=n.quality||'standard';methods(n.type).then(ms=>{const s=e.querySelector('[data-field=method]');s.innerHTML=ms.map(m=>`<option>${m.id}</option>`).join('');s.value=n.method||ms[0]?.id||''});loadText(e.querySelector('.preview'),n);bind(e,n)});draw()}
function bind(e,n){e.addEventListener('pointerdown',()=>e.parentNode.append(e));e.querySelectorAll('select').forEach(x=>x.onchange=()=>api('/api/node',{id:n.id,[x.dataset.field]:x.value}));e.querySelector('.prompt').oninput=x=>n.prompt=x.target.value;e.querySelector('.prompt').onblur=()=>api('/api/node',{id:n.id,prompt:n.prompt});e.querySelector('[data-action=generate]').onclick=()=>api('/api/generate',{id:n.id,prompt:n.prompt,model:$('#model').value,effort:$('#effort').value,useGhPrefix:$('#gh').checked});e.querySelector('[data-action=download]').onclick=()=>{const a=document.createElement('a');a.href=url(n);a.download=n.artifact;a.click()};e.querySelector('[data-preview-image]')?.addEventListener('click',x=>open(x.target.src));let d;e.querySelector('header').onpointerdown=x=>{d={x:x.clientX,y:x.clientY,x0:n.x||0,y0:n.y||0};x.currentTarget.setPointerCapture(x.pointerId)};e.querySelector('header').onpointermove=x=>{if(d){n.x=d.x0+(x.clientX-d.x)/state.scale;n.y=d.y0+(x.clientY-d.y)/state.scale;e.style.left=n.x+'px';e.style.top=n.y+'px';draw()}};e.querySelector('header').onpointerup=async x=>{if(!d)return;const hit=document.elementsFromPoint(x.clientX,x.clientY).map(x=>x.closest('.card')).find(Boolean);const old={x:d.x0,y:d.y0};d=null;if(hit&&+hit.dataset.id!==n.id){n.x=old.x;n.y=old.y;await api('/api/link',{source:n.id,target:+hit.dataset.id})}else await api('/api/node',n)}}
function draw(){const s=$('.edges');s.querySelectorAll('.edge,.edge-hit').forEach(x=>x.remove());Object.values(state.nodes).forEach(t=>t.inputs.forEach(id=>{const a=state.nodes[id];if(!a)return;const d=`M${a.x+250} ${a.y+15} C${(a.x+250+t.x)/2} ${a.y+15}, ${(a.x+250+t.x)/2} ${t.y+15}, ${t.x} ${t.y+15}`;for(const c of['edge','edge-hit']){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.classList.add(c);p.setAttribute('d',d);if(c==='edge-hit')p.oncontextmenu=e=>{e.preventDefault();api('/api/unlink',{source:id,target:t.id})};s.append(p)}}))}
$('#viewport').ondblclick=e=>{if(e.target.closest('.card'))return;const r=$('#viewport').getBoundingClientRect();api('/api/node',{x:e.clientX-r.left,y:e.clientY-r.top,type:'text',method:'llm',quality:'standard',prompt:''})};$('#viewport').onwheel=e=>{if(e.target.closest('textarea,pre'))return;e.preventDefault();state.scale=Math.max(.35,Math.min(2,state.scale*(e.deltaY<0?1.1:.9)));$('#world').style.transform=`scale(${state.scale})`};$('#reset').onclick=()=>api('/api/layout',{});new EventSource('/api/events').onmessage=load;load();
</script>
