const $=s=>document.querySelector(s),state={nodes:{}},registry=fetch('/api/registry').then(r=>r.json());let scale=1,ox=0,oy=0;const order=new Map();const esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const url=n=>n.artifact&&n.workdir?'/api/file?path='+encodeURIComponent(n.workdir+'/'+n.artifact):'';

// What an artifact was built from, snapshotted when it was generated. The links on
// the canvas cannot answer this after an input card is relinked or deleted, which
// is exactly when a person wants to know how a finished film was made.
// The material's own name, not the path of the copy that keeps it: `s2-from-3-
// three-sine-tones.wav` is storage layout, and printing it turned a one-line answer
// into two lines of noise. The copy is still named in the tooltip for anyone
// checking the bytes.
// What the audio of a narration measured, and what it said. The server measures the
// published bytes and keeps the numbers, so this line is evidence rather than a claim
// the agent made: onsets are compared with the words of the script, and a take that
// did not measure as speech was never published at all. Phrases are in the tooltip,
// because a person listening also wants to know where each sentence begins.
//
// Two facts a listener needs and used to have to guess at: that the words written here are
// the words in the file (the server rebinds the bytes to this script before publishing, and
// reports the correlation), and which card those words came from. A reviewer found a build
// where a card could show one sentence and play another; saying `read from #2` and `matched

function narration(n){const v=n.narration;if(!v||typeof v!=='object')return'';const where=(v.phrases||[]).map(p=>`${p.start.toFixed(2)}s  ${p.text}`).join('\n');const src=v.source&&v.source.id!=null?`#${v.source.id}${v.source.artifact?' '+shown(v.source.artifact):''}`:null;const bind=v.take&&typeof v.take.correlation==='number'?`matched ${v.take.correlation.toFixed(3)}`:'unbound';const imprecise=v.take&&v.take.voice&&v.take.voice.recorded&&v.take.voice.matched&&v.take.voice.recorded.rate!==v.take.voice.matched.rate?` (timeline recorded rate ${v.take.voice.recorded.rate}, audio is ${v.take.voice.matched.rate})`:'';const what=src?`read from ${esc(src)}`:`own prompt`;return `<div class="meta narration" title="${esc((where?`The script, with each phrase's start time:\n`+where+'\n\n':'')+`The published bytes were re-rendered from this script to check they say it: ${bind}.`)}">narration: ${esc(v.seconds)}s, ${esc(v.words)} words, ${esc(v.onsets)} syllable onsets, ${esc(v.vowelKinds)} vowel regions, measured ${esc(v.verdict)} · ${what} · ${esc(bind)}${esc(imprecise)}</div>`}
function sources(n){if(!Array.isArray(n.sources)||!n.sources.length)return'';return`<div class="sources" title="Materials this artifact was generated from">made from ${n.sources.map(s=>`#${s.id} ${esc(s.type)}${s.artifact?` <i${s.file?` title="kept as ${esc(s.file)}, so a later change upstream cannot rewrite what this was made from"`:''}>`+esc(shown(s.artifact))+'</i>':''}`).join(' · ')}</div>`}
// Every version this card has finished, oldest first. A person who edits material
// upstream and presses Generate again should not have to lose the render they
// already liked - so each earlier one stays one click away.
function versions(n){if(!Array.isArray(n.versions)||!n.versions.length)return'';// The label is the version the film was published as (`v2`), not the bookkeeping id,
// so it reads against the `v1`/`v2` in the title bar instead of inventing `v4`.
// A version is told apart by what it was asked for, not only by its filename: two
// takes of one card produce `v1-film.mp4` and `v2-film.mp4`, which say nothing about
// which poster and which instructions each one saw.
// Kept versions exist so a person can choose between two takes, and choosing means
// seeing them together. Watching one, then swapping the card, is the only way this

// button next to them that plays both.

// The box holds what the person wants next; the artifact holds what it was last asked
// for. Usually they are the same text. When they are not - a half-typed next take, or
// an older workspace - saying so is the difference between "I am looking at the film I
// asked for" and "I am looking at something and cannot tell".
// Two different silences, and only one of them is fine. If the artifact has an
// instruction recorded and it matches the box, there is nothing to say. If it has an
// artifact but no recorded instruction - a version kept before prompts were stored,
// which is what a card looks like the first time it is opened after upgrading - then
// saying nothing reads as "yes, this is what you asked for", and that is the one thing

// Two takes, together, on the same screen. A person keeps versions in order to pick

// file endpoint, so what is compared is exactly what the card would show.

function compare(n, id) {

  const kept = (n.versions || []).filter(v => v.file);
  if (!kept.length) return;
  // Newest first: the version someone just replaced is the one they most likely want
  // next to the result that replaced it.
  const options = [...kept].reverse();
  const label = v => (badge(v.file) ? 'v' + badge(v.file) : shown(v.file) || 'kept') + (typeof v.prompt === 'string' ? ' — ' + (oneLine(v.prompt) || '(no prompt)') : '');

function shell(n){const e=document.createElement('article');e.className='card';e.dataset.id=n.id;e.innerHTML=`<header><span class="title">${esc(shown(n.artifact)||'New node')}</span><span class="meta">#${n.id} ${badge(n.artifact)?('v'+badge(n.artifact)+' '):''}${esc(n.status)}</span><button class="delete" data-delete>Delete</button></header><main><div class="preview">${preview(n)}</div><div class="selectors"><select data-field="type" aria-label="Output type">${['text','image','audio','video'].map(x=>`<option>${x}</option>`).join('')}</select><select data-field="method" aria-label="Generation method" title="Methods whose local tool is missing stay listed and are marked"><option>${esc(n.method||'loading...')}</option></select><select data-field="quality" aria-label="Quality preset">${['sketch','demo','standard','artistic','realistic'].map(x=>`<option>${x}</option>`).join('')}</select></div><textarea data-prompt aria-label="Prompt">${esc(n.prompt||'')}</textarea><div class="method-slot"></div><div class="used-slot">${used(n)}</div><div class="sources-slot">${sources(n)}</div><div class="narration-slot">${narration(n)}</div><div class="versions-slot">${versions(n)}</div><div class="actions"><button data-generate ${n.status==='running'||!n.method?'disabled':''}>${n.status==='running'?'Generating…':'Generate'}</button><button data-cancel ${n.status==='running'?'':'hidden'}>Stop</button><button data-download ${n.artifact?'':'disabled'}>Download</button></div>${n.error?`<div class="error">${esc(n.error)}</div>`:''}</main>`;e.querySelector('[data-field=type]').value=n.type;e.querySelector('[data-field=quality]').value=n.quality||'standard';fillMethods(e,n);text(e.querySelector('.preview'),n);bind(e,n);return e}
// The method list belongs to the *type*, so it has to be rebuilt whenever the type can
// have changed. It used to be filled once, when the card was built - so a person who
// switched a new text card to audio kept seeing `llm`, could not choose the offline
// `synth` method the README recommends, and the server would run `bark.cpp` behind a
// dropdown that said otherwise. `sync` now calls this too, guarded on the type it was
// built for so an unchanged card does not re-fetch on every reload.

// Say it before the press, not after the failure: a method that needs a binary this
// machine does not have will fail, and the card is where a person looks.
function fillMethodNotice(e,n,ms){const m=ms.find(x=>x.id===n.method);const slot=e.querySelector('.method-slot');if(!slot)return;slot.innerHTML=m&&m.available===false?`<div class="meta">${esc(m.id)} needs ${esc((m.requires||[]).join(', '))} on this machine; nothing will generate until it exists. Pick another method, or install it.</div>`:''}
function sync(e,n){if(n.status==='running')clearNotice(e);if(e.querySelector('.title').textContent!==(shown(n.artifact)||'New node'))e.querySelector('.title').textContent=shown(n.artifact)||'New node';const m=e.querySelector('.meta');const want=`#${n.id} ${badge(n.artifact)?('v'+badge(n.artifact)+' '):''}${n.status}`;if(m.textContent!==want)m.textContent=want;const c=e.querySelector('[data-cancel]');c.hidden=n.status!=='running';c.disabled=n.status!=='running';const gg=e.querySelector('[data-generate]');if(gg&&gg.textContent!==(n.status==='running'?'Generating…':'Generate'))gg.textContent=n.status==='running'?'Generating…':'Generate';const ta=e.querySelector('[data-prompt]');if(ta!==document.activeElement&&ta.value!==(n.prompt||''))ta.value=n.prompt||'';const g=e.querySelector('[data-generate]');g.disabled=n.status==='running'||!e.querySelector('[data-field=method]').value;e.querySelector('[data-download]').disabled=!n.artifact;fillMethods(e,n);const ul=e.querySelector('.used-slot');if(ul){const want=used(n);if(ul.innerHTML!==want)ul.innerHTML=want}const sl=e.querySelector('.sources-slot');if(sl){const want=sources(n);if(sl.innerHTML!==want)sl.innerHTML=want}const nl=e.querySelector('.narration-slot');if(nl){const want=narration(n);if(nl.innerHTML!==want)nl.innerHTML=want}const vl=e.querySelector('.versions-slot');if(vl){const want=versions(n);if(vl.innerHTML!==want)vl.innerHTML=want}const q=e.querySelector('[data-field=quality]');if(q.value!==(n.quality||'standard'))q.value=n.quality||'standard';if(e.dataset.shown!==`${n.artifact}|${n.error}`){e.dataset.shown=`${n.artifact}|${n.error}`;const p=e.querySelector('.preview');p.innerHTML=preview(n);text(p,n);e.querySelector('.error')?.remove();if(n.error){const x=document.createElement('div');x.className='error';x.textContent=n.error;e.querySelector('main').append(x)}}}
function render(){const root=$('#cards'),seen=new Set();for(const n of Object.values(state.nodes)){seen.add(n.id);if(!order.has(n.id)){order.set(n.id,stacking.next++);paintOrder()}let e=root.querySelector(`[data-id="${n.id}"]`);if(!e){e=shell(n);root.append(e)}else sync(e,n);e.style.left=(n.x||0)+'px';e.style.top=(n.y||0)+'px'}for(const k of [...root.children])if(!seen.has(+k.dataset.id))k.remove();for(const id of [...order.keys()])if(!seen.has(id))order.delete(id);draw()}
function bind(e,n){
  e.addEventListener('pointerdown',()=>raise(n.id));
  const ta=e.querySelector('[data-prompt]');
  e.querySelectorAll('select').forEach(x=>x.onchange=()=>changeField(n,x));
  let typing=null;

  // Stop is the one control that has to work while the card is running, so it is
  // a separate button rather than the disabled Generate turning into something else.
  e.querySelector('[data-cancel]').onclick=()=>{const x=e.querySelector('[data-cancel]');x.disabled=true;safe(()=>fetch('/api/cancel',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:n.id})}).then(r=>r.json()).then(load))};
  e.querySelector('[data-download]').onclick=()=>{raise(n.id);const a=document.createElement('a');a.href=url(nodeAt(n.id));a.download=shown(nodeAt(n.id).artifact);a.click()};
  // Restore is delegated: the version buttons are re-rendered whenever the card
  // syncs, so binding each one would leave listeners on detached nodes.
  e.querySelector('.versions-slot').onclick=x=>{const c=x.target.closest('[data-compare]');if(c){compare(nodeAt(n.id),n.id);return}const b=x.target.closest('[data-version]');if(!b)return;raise(n.id);safe(()=>api('/api/restore',{id:n.id,version:+b.dataset.version}))};
  e.querySelector('[data-delete]').onclick=()=>{if(confirm('Delete this node?'))safe(()=>api('/api/delete',{id:n.id}))};
  const header=e.querySelector('header');
  header.onpointerdown=x=>{if(x.button!==0||x.target.closest('button'))return;x.preventDefault();raise(n.id);e.classList.add('dragging');beginDrag(x,e,n)};
}
function changeField(n,x){const src=x.dataset.field==='type'?methods(x.value).then(ms=>()=>api('/api/node',{id:n.id,type:x.value,method:ms[0]?.id||null,artifact:null,script:null})):Promise.resolve(()=>api('/api/node',{id:n.id,[x.dataset.field]:x.value}));safe(()=>src.then(run=>run()))}
// A refused Generate - a linked draft with nothing in it, a card already running -
// used to leave the button greyed out with no explanation on the card at all; the
// reason was in the console. A person needs the sentence where the button is, and a
// way back: the button has to be usable again so they can fix it and retry.
// A refused Generate - a linked draft with nothing in it, a card already running -
// used to leave the button greyed out with no explanation on the card at all, and
// the reason only in the console. A person needs the sentence where the button is,
// and a way back: the button must be usable again so they can fix it and retry.
//
// The message lives in `.notice`, not `.error`: `.error` is the outcome of the last
// run and is owned by the server's record. A refusal never started a run, so it must
// not look like one, and it must not be wiped by the next sync of an unrelated card.
function generate(n,e,ta){raise(n.id);const p=ta.value,node=nodeAt(n.id);node.prompt=p;const btn=e.querySelector('[data-generate]');btn.disabled=true;clearNotice(e);safe(()=>api('/api/generate',{id:node.id,prompt:p,model:$('#model').value,effort:$('#effort').value,useGhPrefix:$('#gh').checked}).catch(err=>{btn.disabled=false;notice(e,err.message)}))}
// Both places, on purpose. The card keeps the sentence, because it is about that
// card and a person may come back to read it. The banner is there because a card can
// sit anywhere on an infinite canvas: one placed low enough puts its own message off
// the bottom of the window, and a greyed-out button with an explanation nobody can
// see is the same silence the report was about.
function notice(e,message){let x=e.querySelector('.notice');if(!x){x=document.createElement('div');x.className='notice';e.querySelector('main').append(x)}x.textContent=message;banner(message)}
function clearNotice(e){e.querySelector('.notice')?.remove();if(!document.querySelector('.notice'))hideBanner()}
let bannerTimer;
function banner(message){let b=document.getElementById('banner');if(!b){b=document.createElement('div');b.id='banner';b.className='banner';b.setAttribute('role','status');document.body.append(b)}b.textContent=message;b.hidden=false;clearTimeout(bannerTimer);bannerTimer=setTimeout(hideBanner,9000)}
function hideBanner(){const b=document.getElementById('banner');if(b)b.hidden=true}
// One drag at a time, owned here instead of per card: a per-card closure plus a
// per-card window listener let a finished drag keep following the pointer, and
// a second dragged card moved together with the first.
let drag=null;
function beginDrag(x,e,n){drag={id:n.id,e,x:x.clientX,y:x.clientY,x0:n.x||0,y0:n.y||0,moved:false}}
function dragTo(x){const node=nodeAt(drag.id);if(!node)return;const dx=x.clientX-drag.x,dy=x.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<4)return;drag.moved=true;node.x=drag.x0+dx/scale;node.y=drag.y0+dy/scale;drag.e.style.left=node.x+'px';drag.e.style.top=node.y+'px';draw()}
function endDrag(x){const d=drag;drag=null;const node=nodeAt(d.id);if(!node){d.e.classList.remove('dragging');return}
  // Dropping on another card's header means "make this an input"; dropping anywhere
  // else keeps the new position, so a person can also stack cards on purpose.
  // The dragged card still carries .dragging (pointer-events:none) here, so the
  // hit test sees the card underneath. Clearing it first made every drop miss:
  // the dragged card sits under the cursor and is always topmost.
  const hit=document.elementsFromPoint(x.clientX,x.clientY).map(h=>h.closest('.card')).find(c=>c&&+c.dataset.id!==d.id);
  const onHeader=hit&&document.elementFromPoint(x.clientX,x.clientY)?.closest('header')?.closest('.card')===hit;
  d.e.classList.remove('dragging');
  if(!d.moved){if(node.x!==d.x0||node.y!==d.y0){node.x=d.x0;node.y=d.y0;d.e.style.left=node.x+'px';d.e.style.top=node.y+'px';draw()}return}
  if(!onHeader){safe(()=>api('/api/node',{id:d.id,x:node.x,y:node.y}));return}
  node.x=d.x0;node.y=d.y0;d.e.style.left=node.x+'px';d.e.style.top=node.y+'px';draw();safe(()=>api('/api/link',{source:d.id,target:+hit.dataset.id}))
}
window.addEventListener('pointermove',x=>{if(!drag)return;x.preventDefault();dragTo(x)});
window.addEventListener('pointerup',x=>{if(drag)endDrag(x)});
window.addEventListener('pointercancel',()=>{if(drag){drag.e.classList.remove('dragging');drag=null}});
function toView(e){const r=$('#viewport').getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}const worldPoint=p=>({x:(p.x-ox)/scale,y:(p.y-oy)/scale});
// Pan and zoom used to call an undefined setView(), so the canvas never moved.
function setView(){const w=$('#world');w.style.transform=`translate(${ox}px,${oy}px) scale(${scale})`}
function draw(){const s=$('.edges');s.querySelectorAll('.edge,.edge-hit').forEach(x=>x.remove());Object.values(state.nodes).forEach(t=>(t.inputs||[]).forEach(id=>{const a=state.nodes[id];if(!a)return;const sx=a.x+250,sy=a.y+15,tx=t.x,ty=t.y+15,m=(sx+tx)/2,d=`M${sx} ${sy} C${m} ${sy},${m} ${ty},${tx} ${ty}`;for(const c of['edge','edge-hit']){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.classList.add(c);p.setAttribute('d',d);if(c==='edge-hit'){p.dataset.source=id;p.dataset.target=t.id;p.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();safe(()=>api('/api/unlink',{source:id,target:t.id}))}}s.append(p)}}))}
// A link that runs behind a card body is still removable: probe with the cards out
// of the hit test, then restore them. Card controls keep their own native menu, so
// right-clicking Delete, Generate, a select or the prompt never unlinks anything.
function unlinkUnderCursor(x,y){const cards=$('#cards');cards.classList.add('probing');const hit=document.elementsFromPoint(x,y).map(e=>e.closest('.edge-hit')).find(Boolean);cards.classList.remove('probing');if(!hit)return false;const source=hit.dataset.source,target=hit.dataset.target;safe(()=>api('/api/unlink',{source,target}));return true}
const ownsMenu=e=>!!e.closest('.edge-hit,button,select,textarea,input,pre,a');
document.addEventListener('contextmenu',e=>{if(ownsMenu(e.target))return;if(!unlinkUnderCursor(e.clientX,e.clientY))return;e.preventDefault();e.stopPropagation()},true);
$('#viewport').ondblclick=e=>{if(e.target.closest('.card'))return;const p=worldPoint(toView(e));api('/api/node',{x:p.x,y:p.y,type:'text',method:'llm',quality:'standard'})};
let panning=null;const stage=document.body;stage.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.card,header'))return;const p=toView(e);panning={x:p.x,y:p.y,ox,oy}});window.addEventListener('pointermove',e=>{if(!panning)return;const p=toView(e);ox=panning.ox+p.x-panning.x;oy=panning.oy+p.y-panning.y;setView()});window.addEventListener('pointerup',()=>panning=null);
$('#viewport').onwheel=e=>{if(e.target.closest('textarea,pre'))return;e.preventDefault();const p=toView(e),w=worldPoint(p),next=Math.max(.35,Math.min(2,scale*(e.deltaY<0?1.1:.9)));ox=p.x-w.x*next;oy=p.y-w.y*next;scale=next;setView()};
$('#reset').onclick=()=>api('/api/layout',{});const add=document.getElementById('add-card');if(add)add.onclick=()=>{const p=worldPoint({x:$('#viewport').clientWidth/2,y:$('#viewport').clientHeight/4});api('/api/node',{x:p.x,y:p.y,type:'text',method:'llm',quality:'standard'})};
new EventSource('/api/events').onmessage=()=>safe(load);load();
</script>
