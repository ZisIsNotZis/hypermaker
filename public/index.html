<!doctype html><meta charset="utf-8"><title>Hypermaker</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#17181b;color:#eee;font:13px system-ui}header{padding:8px;background:#24262b;display:flex;gap:8px;align-items:center}.viewport{height:calc(100% - 48px);position:relative;overflow:hidden;background:#17181b}.world{position:absolute;inset:0}.cards{position:absolute;inset:0}.card{position:absolute;width:250px;background:#272a30;border:1px solid #555;border-radius:6px;overflow:hidden}.card header{height:30px;padding:5px;cursor:grab}.card main{padding:7px}.preview{height:110px;background:#111;display:flex;align-items:center;justify-content:center;overflow:auto}.preview pre{white-space:pre-wrap;overflow-wrap:anywhere}.selectors{display:flex;gap:4px}.selectors select,textarea{width:100%;background:#17191d;color:#eee;border:1px solid #555}textarea{height:58px;margin:6px 0;resize:vertical}.actions{display:flex;gap:5px}.edges{position:absolute;inset:0;z-index:4;pointer-events:none}.edge{fill:none;stroke:#8bd5ff;stroke-width:3;marker-end:url(#arrow)}.edge-hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke}.meta{font-size:11px;color:#aab2bf}.delete{margin-left:auto;color:#ff9b9b}</style>
<header><b>◆ Hypermaker</b><button id="reset">Reset layout</button><label>model <select id="model"><option>gpt-5.6-luna</option><option>gpt-5.6-terra</option><option>gpt-5.6-sol</option></select></label><label>effort <select id="effort"><option>none</option><option>low</option><option selected>medium</option><option>high</option><option>xhigh</option><option>max</option><option>ultra</option></select></label><label><input id="gh" type="checkbox"> use gh/ prefix</label></header>
<div class="viewport" id="viewport"><div class="world" id="world"><svg class="edges"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8bd5ff"/></marker></defs></svg><div class="cards" id="cards"></div></div></div>
<script>
const $=s=>document.querySelector(s),state={nodes:{}},registry=fetch('/api/registry').then(r=>r.json());let scale=1,pan=null,ox=0,oy=0;const esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const url=n=>n.artifact&&n.workdir?'/api/file?path='+encodeURIComponent(n.workdir+'/'+n.artifact):'';const methods=t=>registry.then(r=>r.methods[t]||[]);
async function api(path,data){const method=path==='/api/node'?(data.id==null?'POST':'PATCH'):'POST';const r=await fetch(path,{method,headers:{'content-type':'application/json'},body:JSON.stringify(data)}),x=await r.json();if(x.error)throw Error(x.error);Object.assign(state,x);render();return x}async function load(){Object.assign(state,await(await fetch('/api/workspace')).json());render()};function preview(n){if(!n.artifact)return'no artifact';const u=url(n);return n.type==='text'?'<pre>loading...</pre>':n.type==='image'?`<img src="${u}" style="max-width:100%;max-height:100%">`:n.type==='audio'?`<audio controls src="${u}"></audio>`:`<video controls src="${u}" style="max-width:100%;max-height:100%"></video>`}async function text(el,n){if(n.type==='text'&&n.artifact)el.innerHTML='<pre>'+esc(await(await fetch(url(n))).text())+'</pre>'}
function render(){const root=$('#cards');root.innerHTML='';Object.values(state.nodes).forEach(n=>{const e=document.createElement('article');e.className='card';e.dataset.id=n.id;e.style.left=(n.x||0)+'px';e.style.top=(n.y||0)+'px';e.innerHTML=`<header>${n.artifact||'New node'} <span class="meta">#${n.id} ${n.status}</span><button class="delete" data-delete>Delete</button></header><main><div class="preview">${preview(n)}</div><div class="selectors"><select data-field="type">${['text','image','audio','video'].map(x=>`<option>${x}</option>`).join('')}</select><select data-field="method"></select><select data-field="quality">${['sketch','demo','standard','artistic','realistic'].map(x=>`<option>${x}</option>`).join('')}</select></div><textarea data-prompt>${esc(n.prompt||'')}</textarea><div class="actions"><button data-generate ${n.status==='running'||!n.method?'disabled':''}>Generate</button><button data-download ${n.artifact?'':'disabled'}>Download</button></div>${n.error?`<div>${esc(n.error)}</div>`:''}</main>`;root.append(e);e.querySelector('[data-field=type]').value=n.type;e.querySelector('[data-field=quality]').value=n.quality||'standard';methods(n.type).then(ms=>{const s=e.querySelector('[data-field=method]');s.innerHTML=ms.map(m=>`<option>${m.id}</option>`).join('');s.value=n.method||ms[0]?.id||''});text(e.querySelector('.preview'),n);bind(e,n)});draw()}
function bind(e,n){e.addEventListener('pointerdown',()=>e.parentNode.append(e));e.querySelectorAll('select').forEach(x=>x.onchange=()=>api('/api/node',{id:n.id,[x.dataset.field]:x.value}));e.querySelector('[data-prompt]').oninput=x=>n.prompt=x.target.value;e.querySelector('[data-prompt]').onblur=()=>api('/api/node',{id:n.id,prompt:n.prompt});e.querySelector('[data-generate]').onclick=()=>api('/api/generate',{id:n.id,prompt:n.prompt,model:$('#model').value,effort:$('#effort').value,useGhPrefix:$('#gh').checked});e.querySelector('[data-download]').onclick=()=>{const a=document.createElement('a');a.href=url(n);a.download=n.artifact;a.click()};e.querySelector('[data-delete]').ondblclick=()=>api('/api/delete',{id:n.id});let d;e.querySelector('header').onpointerdown=x=>{d={x:x.clientX,y:x.clientY,x0:n.x||0,y0:n.y||0};x.currentTarget.setPointerCapture(x.pointerId)};e.querySelector('header').onpointermove=x=>{if(d){n.x=d.x0+(x.clientX-d.x)/scale;n.y=d.y0+(x.clientY-d.y)/scale;e.style.left=n.x+'px';e.style.top=n.y+'px';draw()}};e.querySelector('header').onpointerup=async x=>{if(!d)return;const hit=document.elementsFromPoint(x.clientX,x.clientY).map(x=>x.closest('.card')).find(c=>c&&c!==e),old={x:d.x0,y:d.y0};d=null;if(hit){n.x=old.x;n.y=old.y;await api('/api/link',{source:n.id,target:+hit.dataset.id})}else await api('/api/node',n)}}
function draw(){const s=$('.edges');s.querySelectorAll('.edge,.edge-hit').forEach(x=>x.remove());Object.values(state.nodes).forEach(t=>t.inputs.forEach(id=>{const a=state.nodes[id];if(!a)return;const d=`M${a.x+250} ${a.y+15} C${(a.x+250+t.x)/2} ${a.y+15}, ${(a.x+250+t.x)/2} ${t.y+15}, ${t.x} ${t.y+15}`;for(const c of['edge','edge-hit']){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.classList.add(c);p.setAttribute('d',d);if(c==='edge-hit')p.oncontextmenu=e=>{e.preventDefault();api('/api/unlink',{source:id,target:t.id})};s.append(p)}}))}$('#viewport').ondblclick=e=>{if(!e.target.closest('.card')){const r=$('#viewport').getBoundingClientRect();api('/api/node',{x:e.clientX-r.left,y:e.clientY-r.top,type:'text',method:'llm',quality:'standard'})}};$('#viewport').onpointerdown=e=>{if(!e.target.closest('.card'))pan={x:e.clientX,y:e.clientY,ox,oy}};$('#viewport').onpointermove=e=>{if(pan){ox=pan.ox+e.clientX-pan.x;oy=pan.oy+e.clientY-pan.y;$('#world').style.transform=`translate(${ox}px,${oy}px) scale(${scale})`}};$('#viewport').onpointerup=()=>pan=null;$('#viewport').onwheel=e=>{if(e.target.closest('textarea,pre'))return;e.preventDefault();scale=Math.max(.35,Math.min(2,scale*(e.deltaY<0?1.1:.9)));$('#world').style.transform=`translate(${ox}px,${oy}px) scale(${scale})`};$('#reset').onclick=()=>api('/api/layout',{});new EventSource('/api/events').onmessage=load;load();
</script>
