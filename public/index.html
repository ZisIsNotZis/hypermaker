<script>
const $=s=>document.querySelector(s),state={nodes:{}},registry=fetch('/api/registry').then(r=>r.json());let scale=1,ox=0,oy=0;const order=new Map();const esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const url=n=>n.artifact&&n.workdir?'/api/file?path='+encodeURIComponent(n.workdir+'/'+n.artifact):'';

// of one film all arrived as `film.mp4`, told apart only by the order they were saved

// What an artifact was built from, snapshotted when it was generated. The links on
// the canvas cannot answer this after an input card is relinked or deleted, which
// is exactly when a person wants to know how a finished film was made.
// The material's own name, not the path of the copy that keeps it: `s2-from-3-
// three-sine-tones.wav` is storage layout, and printing it turned a one-line answer
// into two lines of noise. The copy is still named in the tooltip for anyone
// checking the bytes.
// What the audio of a narration measured, and what it said. The server measures the
// published bytes and keeps the numbers, so this line is evidence rather than a claim
// the agent made: onsets are compared with the words of the script, and a take that
// did not measure as speech was never published at all. Phrases are in the tooltip,
// because a person listening also wants to know where each sentence begins.
//
// Two facts a listener needs and used to have to guess at: that the words written here are
// the words in the file (the server rebinds the bytes to this script before publishing, and
// reports the correlation), and which card those words came from. A reviewer found a build
// where a card could show one sentence and play another; saying `read from #2` and `matched

//

// run is started: a listen costs the same as pressing play on the take you already have.
// Each button carries its own measured span as data, so the player can work out "which
// sentence is this?" from its clock alone. That is what lets the card and the player show

// A take can be honest and still have been made by an older reading table - the words are the
// right words, said the way an earlier build said them. That is not an error, so it is not
// shown as one; it is a fact about the recording, like its speed, and a listener deciding

// verifies, and it was made by a *voice this build no longer speaks with*. Saying so is not a

// Which material went into *this* take - not which material the upstream card holds
// now. The version is the source card's publish ordinal (`v2`), the same label that
// card's own title carries; without it two takes of one film both read `poster.png`,
// and a person comparing them cannot see that the poster was regenerated between

function sourceList(list){if(!Array.isArray(list)||!list.length)return'';return list.map(s=>`#${s.id} ${esc(s.type)}${s.artifact?` <i${s.file?` title="kept as ${esc(s.file)}, so a later change upstream cannot rewrite what this was made from"`:''}>`+esc(shown(s.artifact))+'</i>'+(badge(s.artifact)?` (v${badge(s.artifact)})`:''):''}`).join(' · ')}

// Two takes, together, on the same screen. A person keeps versions in order to pick

function compare(n, id) {

  // next to the result that replaced it.
  const options = [...kept].reverse();
  const label = v => (badge(v.file) ? 'v' + badge(v.file) : shown(v.file) || 'kept') + (typeof v.prompt === 'string' ? ' — ' + (oneLine(v.prompt) || '(no prompt)') : '');
  const pick = (side, chosen) => `<select data-pick="${side}">${side === 'left' ? `<option value="card">${esc('the card: ' + (badge(n.artifact) ? 'v' + badge(n.artifact) : shown(n.artifact)))}</option>` : ''}${options.map(v => `<option value="${v.id}"${v.id === chosen ? ' selected' : ''}>${esc(label(v))}</option>`).join('')}</select>`;

  const promptOf = value => value === 'card' ? n.promptUsed : (kept.find(v => String(v.id) === String(value)) || {}).prompt;
  const sourcesOf = value => value === 'card' ? n.sources : (kept.find(v => String(v.id) === String(value)) || {}).sources;

  // named the prompt its take was asked for and nothing about what it was made from, so
  // a film re-rendered after its poster changed read as the same film twice. This is the
  // take's own frozen record, read from the same node record as its bytes.

    const who = value === 'card' ? 'on the card' : (badge(fileOf(value)) ? 'kept v' + badge(fileOf(value)) : 'kept ' + shown(fileOf(value)));
    const asked = promptOf(value);

  };

    const left = overlay.querySelector('[data-pick="left"]').value, right = overlay.querySelector('[data-pick="right"]').value;

// Play one phrase of the take the card is showing, and stop at its end. The player is the
// ordinary preview element, so the sound is the same bytes a person hears with play; all

// One sound at a time, everywhere. Comparing two cuts is the reason the compare panel
// exists, and until this line existed it played *both*: the two panes of two narrated
// takes started together and a person comparing them heard two voices over each other -
// the picture could be compared and the sound could not, on a product whose films carry
// narration. The rule is stated once for the whole document rather than inside the panel,
// because the same thing happens to a card preview left playing behind a panel, and
// because a `play` that starts while something else is already sounding is never what a
// person meant here. `pause()` on the other element fires its own `pause`, which is what
// clears a phrase chip - so the card and the player keep agreeing.
document.addEventListener('play',e=>{const t=e.target;if(!(t instanceof HTMLMediaElement))return;for(const m of document.querySelectorAll('audio,video'))if(m!==t&&!m.paused)m.pause()},true);
new EventSource('/api/events').onmessage=()=>safe(load);load();
