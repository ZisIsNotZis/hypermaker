<!doctype html><meta charset="utf-8"><title>Hypermaker</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#17181b;color:#eee;font:13px system-ui}header{padding:8px;background:#24262b;display:flex;gap:8px;align-items:center}header select{color:#eee;background:#17191d;color-scheme:dark}button,select,textarea{font:inherit;color:#eee;background:#17191d;border:1px solid #4b505a;border-radius:4px;padding:6px}button{cursor:pointer}.viewport{height:calc(100% - 48px);position:relative;overflow:hidden;background:#17181b}.world{position:absolute;inset:0;touch-action:none;transform-origin:0 0}.edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}.cards{position:absolute;inset:0;pointer-events:none}.cards .card{pointer-events:auto}.cards.probing .card,.card.dragging{pointer-events:none}.card{position:absolute;width:250px;background:#272a30;border:1px solid #555;border-radius:6px;overflow:hidden;box-shadow:0 2px 6px #0006}.card.raised{border-color:#7b86a1;box-shadow:0 8px 24px #000c}.card.dragging,.card.dragging *{user-select:none!important}.card header{height:30px;padding:5px;cursor:grab;display:flex;gap:6px;align-items:center}.card header .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card header .delete{margin-left:auto;color:#ff9b9b}.card main{padding:7px}.preview{aspect-ratio:4/3;contain:size;background:#111;display:flex;align-items:center;justify-content:center;overflow:auto}.preview pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:4px;font:inherit}.preview img,.preview video{max-width:100%;max-height:100%}.selectors{display:flex;gap:4px}.selectors select,textarea{width:100%}textarea{height:58px;margin:6px 0;resize:vertical;overflow-x:hidden}.actions{display:flex;gap:5px}.edge{fill:none;stroke:#54c7ff;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow);pointer-events:none}.edge-hit{fill:none;stroke:transparent;stroke-width:20;pointer-events:stroke}.meta{font-size:11px;color:#aab2bf}.error{color:#ff9b9b;font-size:11px;margin-top:4px}</style>
<header><b>◆ HyperMaker</b><label>model <select id="model"><option>gpt-5.6-luna</option><option>gpt-5.6-terra</option><option>gpt-5.6-sol</option></select></label><label>effort <select id="effort"><option>none</option><option>low</option><option selected>medium</option><option>high</option><option>xhigh</option><option>max</option><option>ultra</option></select></label><label><input id="gh" type="checkbox"> use gh/ prefix</label><button id="add-card">+ Card</button><button id="reset" hidden>Reset</button></header>
<div class="viewport" id="viewport"><div class="world" id="world"><svg class="edges" aria-label="Node links"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#54c7ff"/></marker></defs></svg><div class="cards" id="cards"></div></div></div>
<script>
const $=s=>document.querySelector(s),state={nodes:{}},registry=fetch('/api/registry').then(r=>r.json());let scale=1,ox=0,oy=0;const order=new Map();const esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const url=n=>n.artifact&&n.workdir?'/api/file?path='+encodeURIComponent(n.workdir+'/'+n.artifact):'';const methods=t=>registry.then(r=>r.methods[t]||[]);const safe=fn=>fn().catch(e=>console.error(e));
async function api(path,data){const method=path==='/api/node'?(data.id==null?'POST':'PATCH'):'POST';const r=await fetch(path,{method,headers:{'content-type':'application/json'},body:JSON.stringify(data)}),x=await r.json();if(x.error)throw Error(x.error);apply(x);return x}async function load(){apply(await(await fetch('/api/workspace')).json())}function apply(x){Object.assign(state,x);render()}
// The card the person touched last is drawn in front; this survives server refreshes
// so a covered card can be picked up from its exposed edge and then used normally.
const stacking={next:1};
function raise(id){id=+id;if(!order.has(id)||[...order.entries()].sort((a,b)=>b[1]-a[1])[0]?.[0]===id){paintOrder();return}const level=stacking.next++;order.set(id,level);paintOrder(level)}
function paintOrder(top=Math.max(0,...order.values())){document.querySelectorAll('.card').forEach(k=>{const level=order.get(+k.dataset.id)||0,front=level===top&&top>0;k.style.zIndex=level?String(level):'';k.classList.toggle('raised',front)})}
function nodeAt(id){return state.nodes[id]}
function preview(n){if(!n.artifact)return'<i class="meta">no artifact yet — write a prompt and press Generate</i>';const u=url(n);return n.type==='text'?'<pre>loading...</pre>':n.type==='image'?`<img alt="${esc(n.artifact)}" src="${u}">`:n.type==='audio'?`<audio controls src="${u}"></audio>`:`<video controls src="${u}"></video>`}async function text(el,n){if(n.type==='text'&&n.artifact)el.innerHTML='<pre>'+esc(await(await fetch(url(n))).text())+'</pre>'}
function shell(n){const e=document.createElement('article');e.className='card';e.dataset.id=n.id;e.innerHTML=`<header><span class="title">${esc(n.artifact||'New node')}</span><span class="meta">#${n.id} ${esc(n.status)}</span><button class="delete" data-delete>Delete</button></header><main><div class="preview">${preview(n)}</div><div class="selectors"><select data-field="type" aria-label="Output type">${['text','image','audio','video'].map(x=>`<option>${x}</option>`).join('')}</select><select data-field="method" aria-label="Generation method"><option>${esc(n.method||'loading...')}</option></select><select data-field="quality" aria-label="Quality preset">${['sketch','demo','standard','artistic','realistic'].map(x=>`<option>${x}</option>`).join('')}</select></div><textarea data-prompt aria-label="Prompt">${esc(n.prompt||'')}</textarea><div class="actions"><button data-generate ${n.status==='running'||!n.method?'disabled':''}>Generate</button><button data-download ${n.artifact?'':'disabled'}>Download</button></div></main>`;e.querySelector('[data-field=type]').value=n.type;e.querySelector('[data-field=quality]').value=n.quality||'standard';fillMethods(e,n);text(e.querySelector('.preview'),n);bind(e,n);return e}
function fillMethods(e,n){methods(n.type).then(ms=>{const node=nodeAt(n.id),s=e.querySelector('[data-field=method]');if(!node)return;s.innerHTML=ms.map(m=>`<option>${m.id}</option>`).join('');s.value=node.method||ms[0]?.id||'';const g=e.querySelector('[data-generate]');if(g)g.disabled=node.status==='running'||!s.value}).catch(console.error)}
function sync(e,n){if(e.querySelector('.title').textContent!==(n.artifact||'New node'))e.querySelector('.title').textContent=n.artifact||'New node';const m=e.querySelector('.meta');if(m.textContent!==`#${n.id} ${n.status}`)m.textContent=`#${n.id} ${n.status}`;const ta=e.querySelector('[data-prompt]');if(ta!==document.activeElement&&ta.value!==(n.prompt||''))ta.value=n.prompt||'';const g=e.querySelector('[data-generate]');g.disabled=n.status==='running'||!e.querySelector('[data-field=method]').value;e.querySelector('[data-download]').disabled=!n.artifact;const q=e.querySelector('[data-field=quality]');if(q.value!==(n.quality||'standard'))q.value=n.quality||'standard';if(e.dataset.shown!==`${n.artifact}|${n.error}`){e.dataset.shown=`${n.artifact}|${n.error}`;const p=e.querySelector('.preview');p.innerHTML=preview(n);text(p,n);e.querySelector('.error')?.remove();if(n.error){const x=document.createElement('div');x.className='error';x.textContent=n.error;e.querySelector('main').append(x)}}}
function render(){const root=$('#cards'),seen=new Set();for(const n of Object.values(state.nodes)){seen.add(n.id);if(!order.has(n.id)){order.set(n.id,stacking.next++);paintOrder()}let e=root.querySelector(`[data-id="${n.id}"]`);if(!e){e=shell(n);root.append(e)}else sync(e,n);e.style.left=(n.x||0)+'px';e.style.top=(n.y||0)+'px'}for(const k of [...root.children])if(!seen.has(+k.dataset.id))k.remove();for(const id of [...order.keys()])if(!seen.has(id))order.delete(id);draw()}
function bind(e,n){
  e.addEventListener('pointerdown',()=>raise(n.id));
  const ta=e.querySelector('[data-prompt]');
  e.querySelectorAll('select').forEach(x=>x.onchange=()=>changeField(n,x));
  let typing=null;
  ta.oninput=()=>{raise(n.id);const val=ta.value;if(nodeAt(n.id))nodeAt(n.id).prompt=val;clearTimeout(typing);typing=setTimeout(()=>safe(()=>api('/api/node',{id:n.id,prompt:val})),300)};
  ta.onblur=()=>{raise(n.id);clearTimeout(typing);const val=ta.value;if(nodeAt(n.id))nodeAt(n.id).prompt=val;safe(()=>fetch('/api/node',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({id:n.id,prompt:val})}).then(()=>load()))};
  e.querySelector('[data-generate]').onclick=()=>generate(n,e,ta);
  e.querySelector('[data-download]').onclick=()=>{raise(n.id);const a=document.createElement('a');a.href=url(nodeAt(n.id));a.download=nodeAt(n.id).artifact;a.click()};
  e.querySelector('[data-delete]').onclick=()=>{if(confirm('Delete this node?'))safe(()=>api('/api/delete',{id:n.id}))};
  const header=e.querySelector('header');
  header.onpointerdown=x=>{if(x.button!==0||x.target.closest('button'))return;x.preventDefault();raise(n.id);e.classList.add('dragging');beginDrag(x,e,n)};
}
function changeField(n,x){const src=x.dataset.field==='type'?methods(x.value).then(ms=>()=>api('/api/node',{id:n.id,type:x.value,method:ms[0]?.id||null,artifact:null,script:null})):Promise.resolve(()=>api('/api/node',{id:n.id,[x.dataset.field]:x.value}));safe(()=>src.then(run=>run()))}
function generate(n,e,ta){raise(n.id);const p=ta.value,node=nodeAt(n.id);node.prompt=p;e.querySelector('[data-generate]').disabled=true;safe(()=>api('/api/generate',{id:node.id,prompt:p,model:$('#model').value,effort:$('#effort').value,useGhPrefix:$('#gh').checked}))}
// One drag at a time, owned here instead of per card: a per-card closure plus a
// per-card window listener let a finished drag keep following the pointer, and
// a second dragged card moved together with the first.
let drag=null;
function beginDrag(x,e,n){drag={id:n.id,e,x:x.clientX,y:x.clientY,x0:n.x||0,y0:n.y||0,moved:false}}
function dragTo(x){const node=nodeAt(drag.id);if(!node)return;const dx=x.clientX-drag.x,dy=x.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<4)return;drag.moved=true;node.x=drag.x0+dx/scale;node.y=drag.y0+dy/scale;drag.e.style.left=node.x+'px';drag.e.style.top=node.y+'px';draw()}
function endDrag(x){const d=drag;drag=null;const node=nodeAt(d.id);if(!node){d.e.classList.remove('dragging');return}
  // Dropping on another card's header means "make this an input"; dropping anywhere
  // else keeps the new position, so a person can also stack cards on purpose.
  // The dragged card still carries .dragging (pointer-events:none) here, so the
  // hit test sees the card underneath. Clearing it first made every drop miss:
  // the dragged card sits under the cursor and is always topmost.
  const hit=document.elementsFromPoint(x.clientX,x.clientY).map(h=>h.closest('.card')).find(c=>c&&+c.dataset.id!==d.id);
  const onHeader=hit&&document.elementFromPoint(x.clientX,x.clientY)?.closest('header')?.closest('.card')===hit;
  d.e.classList.remove('dragging');
  if(!d.moved){if(node.x!==d.x0||node.y!==d.y0){node.x=d.x0;node.y=d.y0;d.e.style.left=node.x+'px';d.e.style.top=node.y+'px';draw()}return}
  if(!onHeader){safe(()=>api('/api/node',{id:d.id,x:node.x,y:node.y}));return}
  node.x=d.x0;node.y=d.y0;d.e.style.left=node.x+'px';d.e.style.top=node.y+'px';draw();safe(()=>api('/api/link',{source:d.id,target:+hit.dataset.id}))
}
window.addEventListener('pointermove',x=>{if(!drag)return;x.preventDefault();dragTo(x)});
window.addEventListener('pointerup',x=>{if(drag)endDrag(x)});
window.addEventListener('pointercancel',()=>{if(drag){drag.e.classList.remove('dragging');drag=null}});
function toView(e){const r=$('#viewport').getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}const worldPoint=p=>({x:(p.x-ox)/scale,y:(p.y-oy)/scale});
// Pan and zoom used to call an undefined setView(), so the canvas never moved.
function setView(){const w=$('#world');w.style.transform=`translate(${ox}px,${oy}px) scale(${scale})`}
function draw(){const s=$('.edges');s.querySelectorAll('.edge,.edge-hit').forEach(x=>x.remove());Object.values(state.nodes).forEach(t=>(t.inputs||[]).forEach(id=>{const a=state.nodes[id];if(!a)return;const sx=a.x+250,sy=a.y+15,tx=t.x,ty=t.y+15,m=(sx+tx)/2,d=`M${sx} ${sy} C${m} ${sy},${m} ${ty},${tx} ${ty}`;for(const c of['edge','edge-hit']){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.classList.add(c);p.setAttribute('d',d);if(c==='edge-hit'){p.dataset.source=id;p.dataset.target=t.id;p.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();safe(()=>api('/api/unlink',{source:id,target:t.id}))}}s.append(p)}}))}
// A link that runs behind a card body is still removable: probe with the cards out
// of the hit test, then restore them. Card controls keep their own native menu, so
// right-clicking Delete, Generate, a select or the prompt never unlinks anything.
function unlinkUnderCursor(x,y){const cards=$('#cards');cards.classList.add('probing');const hit=document.elementsFromPoint(x,y).map(e=>e.closest('.edge-hit')).find(Boolean);cards.classList.remove('probing');if(!hit)return false;const source=hit.dataset.source,target=hit.dataset.target;safe(()=>api('/api/unlink',{source,target}));return true}
const ownsMenu=e=>!!e.closest('.edge-hit,button,select,textarea,input,pre,a');
document.addEventListener('contextmenu',e=>{if(ownsMenu(e.target))return;if(!unlinkUnderCursor(e.clientX,e.clientY))return;e.preventDefault();e.stopPropagation()},true);
$('#viewport').ondblclick=e=>{if(e.target.closest('.card'))return;const p=worldPoint(toView(e));api('/api/node',{x:p.x,y:p.y,type:'text',method:'llm',quality:'standard'})};
let panning=null;const stage=document.body;stage.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.card,header'))return;const p=toView(e);panning={x:p.x,y:p.y,ox,oy}});window.addEventListener('pointermove',e=>{if(!panning)return;const p=toView(e);ox=panning.ox+p.x-panning.x;oy=panning.oy+p.y-panning.y;setView()});window.addEventListener('pointerup',()=>panning=null);
$('#viewport').onwheel=e=>{if(e.target.closest('textarea,pre'))return;e.preventDefault();const p=toView(e),w=worldPoint(p),next=Math.max(.35,Math.min(2,scale*(e.deltaY<0?1.1:.9)));ox=p.x-w.x*next;oy=p.y-w.y*next;scale=next;setView()};
$('#reset').onclick=()=>api('/api/layout',{});const add=document.getElementById('add-card');if(add)add.onclick=()=>{const p=worldPoint({x:$('#viewport').clientWidth/2,y:$('#viewport').clientHeight/4});api('/api/node',{x:p.x,y:p.y,type:'text',method:'llm',quality:'standard'})};
new EventSource('/api/events').onmessage=()=>safe(load);load();
</script>
