<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hypermaker</title>
<style>.input-row{display:flex;gap:4px;margin:4px 0}.input-row input{min-width:0;flex:1;background:#17191c;border:1px solid #464b54;color:#eee;border-radius:4px;padding:5px;font-size:11px}.input-row button{padding:2px 7px}.question{margin-top:7px;padding:6px;background:#363029;border-radius:4px}.question input{width:100%;margin:5px 0;background:#17191c;color:#eee;border:1px solid #665}</style>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#161719;color:#e7e9ed;font:13px system-ui}header{height:50px;display:flex;align-items:center;gap:8px;padding:8px 14px;background:#202226;border-bottom:1px solid #383b42;position:relative;z-index:3}header b{font-size:16px;margin-right:12px}header input{width:380px;background:#151619;border:1px solid #4b4f58;color:#eee;border-radius:5px;padding:8px 10px;overflow:hidden}button,select{background:#30343b;color:#eee;border:1px solid #50555f;border-radius:5px;padding:7px 10px;cursor:pointer}.status{margin-left:auto;color:#9aa1ad;max-width:440px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#viewport{height:calc(100% - 50px);overflow:hidden;position:relative;cursor:grab;background-color:#191a1d;background-image:radial-gradient(#3b3e45 1px,transparent 0);background-size:24px 24px}#viewport.panning{cursor:grabbing}.world{position:absolute;left:0;top:0;transform-origin:0 0;width:100000px;height:100000px}.edges{position:absolute;left:0;top:0;width:100000px;height:100000px;z-index:10000;overflow:visible;pointer-events:none}.edge{fill:none;stroke:#ffffff;stroke-width:5;opacity:1;pointer-events:none}.edge-arrow{fill:#ffffff;stroke:#ffffff}.cards{position:absolute;inset:0;z-index:1}.card{position:absolute;width:300px;background:#25282e;border:1px solid #4b515c;border-radius:7px;box-shadow:0 8px 22px #0007;overflow:hidden;user-select:none}.card h3{margin:0;padding:9px 11px;background:#2e3239;border-bottom:1px solid #444952;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body{padding:10px}.preview{height:120px;display:flex;align-items:center;justify-content:center;background:#151619;border-radius:4px;overflow:hidden;margin-bottom:8px}.preview img,.preview video{max-width:100%;max-height:100%}.preview img{cursor:zoom-in}.preview audio{width:95%}.text-preview{padding:8px;width:100%;height:100%;overflow:auto;overflow-x:hidden;overflow-wrap:anywhere;white-space:pre-wrap;color:#c9ced7}.text-preview pre{margin:0;overflow:visible;overflow-wrap:anywhere;white-space:pre-wrap}.new-preview{color:#7c8490}.meta{color:#9da4af;font-size:11px;margin-bottom:7px}.selectors{display:flex;gap:6px;margin-bottom:7px}.selectors select{min-width:0;flex:1;background:#17191c;padding:6px;font-size:11px}.prompt{width:100%;height:60px;resize:vertical;background:#17191c;border:1px solid #464b54;color:#eee;border-radius:4px;padding:7px;margin-bottom:7px;font:12px system-ui;user-select:text;overflow-x:hidden;overflow-wrap:anywhere;white-space:pre-wrap}.actions{display:flex;gap:6px;flex-wrap:wrap}.trajectory{margin-top:8px;background:#111317;border:1px solid #363b44;border-radius:4px;color:#bac2ce;max-height:140px;overflow:auto;overflow-x:hidden;overflow-wrap:anywhere;padding:6px;font:11px ui-monospace,monospace;white-space:pre-wrap}.error{color:#f08080;white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:hidden;margin-top:7px;max-height:52px;overflow:auto}.empty{padding:28px;color:#78808c}
</style><header><b>Hypermaker</b><input id="path" placeholder="Import artifact path"><button id="import">Import</button><button id="layout">Reset layout</button><span class="status" id="activity">Double-click canvas to create node · drag cards to link</span></header><section id="viewport"><div id="world" class="world"><div id="cards" class="cards"></div><svg id="edges" class="edges" viewBox="0 0 100000 100000" aria-hidden="true"><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path class="edge-arrow" d="M0 0 L14 7 L0 14 Z"></path></marker></defs></svg></div></section>
<style>
.card{width:280px;border-radius:6px;box-shadow:0 6px 16px #0007}
.card h3{padding:6px 8px;font-size:12px}
.body{padding:7px}
.preview{height:150px;margin-bottom:6px}
.meta{font-size:10px;margin-bottom:5px}
.selectors{gap:4px;margin-bottom:5px}
.selectors select{padding:5px;font-size:10px}
.prompt{height:48px;padding:6px;margin-bottom:5px;font-size:11px}
.actions{gap:4px}.actions button{padding:5px 7px;font-size:11px}
.trajectory{margin-top:6px;max-height:110px;padding:5px;font-size:10px}
.preview-error{width:100%;padding:9px;color:#f08080;white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:hidden;overflow:auto}
</style><script>
// Wheel over controls belongs to control; wheel over background zooms canvas.
const methods={text:['llm'],image:['hyperframe','remotion'],audio:[],video:['hyperframe','remotion']},types=['text','image','audio','video'];
const $=id=>document.getElementById(id),viewport=$('viewport'),world=$('world'),cards=$('cards'),edgesSvg=$('edges'),activity=$('activity'),nodes=new Map(),events=new EventSource('/events');window.nodes=nodes;let scale=1,pan={x:0,y:0},moving=null,drag=null,front=0;
viewport.addEventListener('wheel',e=>{if(e.target.closest('textarea,input,select,button,audio,video,.trajectory,.text-preview'))e.stopImmediatePropagation()},{capture:true,passive:false});
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'),key=n=>n.id||n.path,pos=n=>n.position||{x:80,y:80};
function preview(n){if(n.error)return`<div class="preview-error">${esc(n.error)}</div>`;if(!n.path)return'<div class="new-preview">No artifact yet</div>';const src='/api/file?path='+encodeURIComponent(n.path)+'&v='+(n.updatedAt||0);if(n.type==='image')return`<img data-preview-image src="${src}" title="Open image" alt="${esc(n.path.split('/').pop())}">`;if(n.type==='audio')return`<audio controls src="${src}"></audio>`;if(n.type==='video')return`<video controls src="${src}"></video>`;return`<div class="text-preview"><pre>${esc(n.content||'Loading…')}</pre></div>`}
function eventText(e){if(e.kind==='tool_call')return`${e.name||'tool'} ${typeof e.input==='string'?e.input:JSON.stringify(e.input??{})}`;return e.text||e.output||e.error||(e.input?JSON.stringify(e.input):e.result?JSON.stringify(e.result):'')}
function drawEdges(){edgesSvg.querySelectorAll('.edge').forEach(e=>e.remove());for(const n of nodes.values())for(const sourcePath of Object.values(n.inputs||{})){const a=nodes.get(sourcePath),b=nodes.get(key(n));if(!a||!b)continue;const p=pos(a),q=pos(b),x=p.x+280,y=p.y+70,X=q.x,Y=q.y+70,c=Math.max(50,(X-x)/2),e=document.createElementNS('http://www.w3.org/2000/svg','path');e.setAttribute('d',`M${x} ${y} C${x+c} ${y},${X-c} ${Y},${X} ${Y}`);e.setAttribute('class','edge');e.setAttribute('marker-end','url(#arrow)');e.setAttribute('vector-effect','non-scaling-stroke');edgesSvg.append(e)}}
function cardMarkup(n){const id=key(n),p=pos(n),available=methods[n.type||'text']||[];return`<article class="card" data-id="${esc(id)}" style="left:${p.x}px;top:${p.y}px;z-index:${n.z||0}"><h3>${esc((n.path||'New generation').split('/').pop())}</h3><div class="body"><div class="preview">${preview(n)}</div><div class="meta">${esc(n.type||'text')} · ${esc(n.method||'')} · ${esc(n.status||'idle')}</div><div class="selectors"><select data-field="type" aria-label="Output type">${types.map(t=>`<option value="${t}" ${t===(n.type||'text')?'selected':''}>${t}</option>`).join('')}</select><select data-field="method" aria-label="Generation method">${available.map(m=>`<option value="${m}" ${m===(n.method||available[0])?'selected':''}>${m}</option>`).join('')}</select></div><textarea class="prompt" placeholder="Describe output...">${esc(n.prompt||'')}</textarea><div class="actions"><button data-action="generate">Generate</button><button data-action="download" ${n.path?'':'disabled'}>Download</button><button data-action="clone">Clone</button><button data-action="delete">Delete</button></div>${n.status==='running'?`<div class="trajectory">${esc(n.latest||'Starting…')}</div>`:''}</div></article>`}
function render(){cards.innerHTML=[...nodes.values()].map(cardMarkup).join('')||'<div class="empty">Double-click to create a generation node.</div>';drawEdges()}
function updateCard(n){const old=document.querySelector(`.card[data-id="${CSS.escape(key(n))}"]`);if(!old){render();return}const active=document.activeElement,editing=active?.closest('.card')?.dataset.id===key(n)&&active.matches('textarea'),selection=editing?{start:active.selectionStart,end:active.selectionEnd}:null;if(editing){const fresh=document.createElement('div');fresh.innerHTML=cardMarkup(n);for(const selector of ['.preview','.meta','.selectors','.actions','.trajectory']){const next=fresh.querySelector(selector),current=old.querySelector(selector);if(next&&current)current.replaceWith(next);else if(next&&!current)old.querySelector('.body').append(next)}old.querySelector('.prompt').value=n.prompt||''}else old.outerHTML=cardMarkup(n);if(editing){const next=old.querySelector('.prompt');next.focus();if(selection)next.setSelectionRange(selection.start,selection.end)}drawEdges()}
function raise(n){n.z=++front;if(n.z>=10000){front=1;n.z=front}const c=document.querySelector(`.card[data-id="${CSS.escape(key(n))}"]`);if(c)c.style.zIndex=n.z}
function apply(){world.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${scale})`}
function relaxLayout(items){const width=280,height=410,gap=32;for(let pass=0;pass<items.length*items.length*2;pass++){let moved=false;for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i],b=items[j],dx=a.position.x-b.position.x,dy=a.position.y-b.position.y;if(Math.abs(dx)>=width||Math.abs(dy)>=height)continue;const push=(height+gap-Math.abs(dy))/2;if(dy<=0){a.position.y-=push;b.position.y+=push}else{a.position.y+=push;b.position.y-=push}moved=true}if(!moved)break}return items}
async function request(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),x=await r.json();if(!r.ok)throw Error(x.error||`${r.status}`);return x}
async function importPath(){try{const x=await request('/api/import',{path:$('path').value});(x.nodes||[]).forEach(n=>nodes.set(key(n),n));render()}catch(e){activity.textContent=e.message}}
async function createNode(clientX,clientY){try{const rect=viewport.getBoundingClientRect(),x=(clientX-rect.left-pan.x)/scale-150,y=(clientY-rect.top-pan.y)/scale-40,xj=await request('/api/node',{position:{x,y}});nodes.set(xj.node.id,xj.node);render()}catch(e){activity.textContent=e.message}}
async function link(source,target){let name=(source.path||source.id||'input').split('/').pop(),base=name,i=2,used=new Set(Object.keys(target.inputs||{}));while(used.has(name))name=base.replace(/(\.[^.]+)?$/,`_${i++}$1`);target.inputs={...(target.inputs||{}),[name]:source.path||source.id};try{await request('/api/link',{source:source.id||source.path,target:target.id||target.path,name});render()}catch(e){activity.textContent=e.message}}
async function generate(id){const n=nodes.get(id),card=document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);n.status='running';n.error='';n.latest='';n.trajectory=[];n.type=card.querySelector('[data-field="type"]').value;n.method=card.querySelector('[data-field="method"]').value;n.prompt=card.querySelector('.prompt').value;updateCard(n);try{await request('/api/generate',{nodeId:n.id,path:n.path,workdir:n.workdir,prompt:n.prompt,inputs:n.inputs,type:n.type,method:n.method})}catch(e){n.status='error';n.error=e.message;updateCard(n)}}
async function clone(id){try{const x=await request('/api/clone',{id});nodes.set(x.node.id,x.node);render()}catch(e){activity.textContent=e.message}}
async function unlink(target,name){try{await request('/api/unlink',{target:target.id||target.path,name});delete target.inputs[name];render()}catch(e){activity.textContent=e.message}}
async function rename(target,from,to){if(!to||to===from)return;try{await request('/api/rename-link',{target:target.id||target.path,from,to});target.inputs[to]=target.inputs[from];delete target.inputs[from];render()}catch(e){activity.textContent=e.message;render()}}
async function answer(target){const card=document.querySelector(`.card[data-id="${CSS.escape(key(target))}"]`),answer=card.querySelector('[data-answer]').value;try{await request('/api/answer',{nodeId:target.id||target.path,id:target.question.id,answer});target.question=null;render()}catch(e){activity.textContent=e.message}}
async function remove(id){const n=nodes.get(id);nodes.delete(id);render();try{await request('/api/delete',{id:n.id,path:n.path})}catch(e){activity.textContent=e.message}}
cards.onchange=e=>{const c=e.target.closest('.card');if(!c)return;const n=nodes.get(c.dataset.id);if(e.target.dataset.field==='type'){n.type=e.target.value;n.method=(methods[n.type]||[])[0];n.status=n.path?'dirty':'dirty';render()}else if(e.target.dataset.field==='method')n.method=e.target.value};cards.oninput=e=>{const c=e.target.closest('.card');if(c&&e.target.matches('.prompt')){const n=nodes.get(c.dataset.id);n.prompt=e.target.value;n.status=n.path?'dirty':'dirty'}};
cards.onmousedown=e=>{const c=e.target.closest('.card');if(!c)return;const n=nodes.get(c.dataset.id);raise(n);if(e.target.closest('button,select,textarea,input,audio,video,.trajectory,.text-preview,[data-preview-image]'))return;const p=pos(n);drag={n,p,x:e.clientX,y:e.clientY,c};e.stopPropagation()};viewport.onmousedown=e=>{if(!e.target.closest('.card')){moving={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};viewport.classList.add('panning')}};onmousemove=e=>{if(drag){drag.n.position={x:drag.p.x+(e.clientX-drag.x)/scale,y:drag.p.y+(e.clientY-drag.y)/scale};drag.c.style.left=drag.n.position.x+'px';drag.c.style.top=drag.n.position.y+'px';drawEdges()}else if(moving){pan.x=moving.px+e.clientX-moving.x;pan.y=moving.py+e.clientY-moving.y;apply()}};onmouseup=async e=>{if(drag){const source=drag.n,original=drag.p;drag.c.hidden=true;const c=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card');drag.c.hidden=false;if(c&&c!==drag.c){source.position=original;drag.c.style.left=original.x+'px';drag.c.style.top=original.y+'px';drawEdges();await link(source,nodes.get(c.dataset.id))}drag=null}else{moving=null;viewport.classList.remove('panning')}};viewport.onwheel=e=>{if(e.target.closest('textarea,input,select,button,audio,video,.trajectory,.text-preview'))return;e.preventDefault();const old=scale,next=Math.min(2.5,Math.max(.25,old*Math.exp(-e.deltaY*.001))),r=viewport.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;pan.x=x-(x-pan.x)*next/old;pan.y=y-(y-pan.y)*next/old;scale=next;apply()};viewport.ondblclick=e=>{if(!e.target.closest('.card'))createNode(e.clientX,e.clientY)};
cards.onclick=e=>{const c=e.target.closest('.card');if(!c)return;const n=nodes.get(c.dataset.id);raise(n);if(e.target.matches('[data-preview-image]')){window.open(e.target.src,'_blank','noopener');return}const b=e.target.closest('button');if(!b)return;const id=c.dataset.id;if(b.dataset.action==='generate')generate(id);else if(b.dataset.action==='download'&&n.path){const a=document.createElement('a');a.href='/api/file?path='+encodeURIComponent(n.path);a.download=n.path.split('/').pop();a.click()}else if(b.dataset.action==='clone')clone(id);else if(b.dataset.action==='unlink')unlink(n,b.dataset.name);else if(b.dataset.action==='answer')answer(n);else remove(id)};$('import').onclick=importPath;$('path').onkeydown=e=>e.key==='Enter'&&importPath();$('layout').onclick=async()=>{try{const x=await request('/api/layout',{});relaxLayout(x.nodes).forEach(n=>{const old=nodes.get(key(n));if(old)old.position=n.position});render()}catch(e){activity.textContent=e.message}};
function eventNode(x){if(x.nodeId&&nodes.has(x.nodeId))return nodes.get(x.nodeId);if(nodes.has(x.path))return nodes.get(x.path);return [...nodes.values()].find(n=>n.id===x.path||n.path===x.path||n.workdir===x.path||x.path?.startsWith((n.workdir||'')+'/'))}
function applyEvent(x){const n=eventNode(x);if(n){if(x.kind==='complete'){n.latest='complete';n.path=x.result.artifact;n.workdir=x.result.artifact.split('/').slice(0,-1).join('/');n.script=x.result.script;n.prompt=x.result.prompt;n.type=x.result.type;n.method=x.result.method;n.status=x.result.error?'warning':'idle';n.error=x.result.error||'';n.updatedAt=Date.now();if(n.type==='text')fetch('/api/file?path='+encodeURIComponent(n.path)+'&v='+n.updatedAt).then(r=>{if(!r.ok)throw Error(`Artifact load failed: ${r.status}`);return r.text()}).then(t=>{n.content=t;updateCard(n)}).catch(error=>{n.error=error.message;updateCard(n)});else updateCard(n)}else{const message=eventText(x),changed=message&&message!==n.latest;if(changed)n.latest=message;if(x.kind==='status'&&n.status!=='running')n.status='running';if(x.kind==='question'){n.question=x;n.status='running'}if(x.kind==='failure'){n.status='error';n.error=x.error}if(changed||x.kind==='status'||x.kind==='question'||x.kind==='failure')updateCard(n)}}activity.textContent=eventText(x)||x.kind}
window.__applyEvent=applyEvent;events.onmessage=e=>applyEvent(JSON.parse(e.data));
cards.addEventListener('error',e=>{if(!e.target.matches('img,audio,video'))return;const n=eventNode({path:e.target.closest('.card')?.dataset.id});if(!n)return;n.error=`Artifact preview failed: ${n.path}`;updateCard(n)},true);
apply();
</script>
